<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Netflix - Entrar</title>
</head>

<body>

    <header>
        <h1>Netflix</h1>
    </header>

    <main>
        <section>
            <h2>Informe seus dados para entrar</h2>
            <h3>Ou crie uma conta</h3>

            <form>
                <label for="email">Email ou número de celular:</label>
                <br>

                <input type="text" id="email" name="email">
                <br>

                <button type="submit">Continuar</button>
                <br>

                <label for="ajuda">Ajuda</label>
                <br>
                <select name="ajuda" id="ajuda">
                <option>Esqueceu o email ou número de celular?</option>
                <option>Saiba mais sobre como entrar</option>
                </select>
            </form>
            <p>Esta página é protegida pelo Google reCAPTCHA para garantir que você não é um robô.</p>

        </section>
    </main>

</body>

</html>
